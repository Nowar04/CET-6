<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>六级生词本</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* ============================================================
           主题变量
        ============================================================ */
        :root {
            /* 浅色（默认） */
            --bg-body: linear-gradient(145deg, #f5f7fe 0%, #e9eef8 100%);
            --bg-body-solid: #f5f8fd;
            --bg-card: #ffffff;
            --bg-card-soft: #f9fbfe;
            --bg-panel: #f4f7fc;
            --bg-input: #ffffff;
            --bg-hover: #f0f4fc;

            --border-soft: #e3eaf3;
            --border-input: #dbe4f0;
            --border-strong: #d4e0ee;

            --text-primary: #1b2e4b;
            --text-secondary: #526b8c;
            --text-muted: #7b8fa8;
            --text-faint: #a5b9d4;
            --text-placeholder: #a5b9d4;

            --accent: #6c8bc7;
            --accent-hover: #5a79b3;
            --accent-soft: #eef4fd;
            --accent-soft-hover: #dae6f7;
            --accent-text: #3b6fc4;

            --danger: #c93a3a;
            --danger-soft: #fdeaea;
            --danger-soft-hover: #ffdada;
            --danger-border: #ffcdcd;
            --danger-deep: #8b1a1a;

            --success: #1e9e4a;
            --success-soft: #e6f7ec;
            --success-border: #b5e6c5;

            --shadow-card: 0 4px 14px -6px rgba(31,45,70,0.1);
            --shadow-card-hover: 0 12px 28px -10px rgba(31,45,70,0.22);
            --shadow-modal: 0 25px 50px -12px rgba(20,35,60,0.3);
            --shadow-toast: 0 12px 24px -8px rgba(20,35,60,0.4);

            --glass-bg: rgba(255, 255, 255, 0.55);
            --glass-border: rgba(255, 255, 255, 0.75);
            --glass-inset: rgba(255, 255, 255, 0.4);
            --glass-inset-top: rgba(255, 255, 255, 0.9);

            --scrollbar-thumb: #b8cae0;
            --scrollbar-track: #eef2f9;

            --modal-mask: rgba(20, 35, 60, 0.4);

            --sidebar-bg: #ffffff;
            --topbar-bg: #ffffff;
        }

        [data-theme="dark"] {
            /* 深色 */
            --bg-body: linear-gradient(145deg, #0f1724 0%, #131c2c 100%);
            --bg-body-solid: #0f1724;
            --bg-card: #1a2433;
            --bg-card-soft: #1e2a3c;
            --bg-panel: #17202e;
            --bg-input: #1e2a3c;
            --bg-hover: #24324a;

            --border-soft: #2a3648;
            --border-input: #2f3e54;
            --border-strong: #364460;

            --text-primary: #e6edf7;
            --text-secondary: #a8b8d0;
            --text-muted: #7e90a8;
            --text-faint: #566275;
            --text-placeholder: #566275;

            --accent: #7ea3e0;
            --accent-hover: #94b3ea;
            --accent-soft: #1e2c44;
            --accent-soft-hover: #263653;
            --accent-text: #8fb4e8;

            --danger: #ff8080;
            --danger-soft: #2e1a1e;
            --danger-soft-hover: #3a2024;
            --danger-border: #4a262a;
            --danger-deep: #ff5757;

            --success: #4ad27d;
            --success-soft: #14301f;
            --success-border: #1f4a30;

            --shadow-card: 0 4px 14px -6px rgba(0,0,0,0.4);
            --shadow-card-hover: 0 12px 28px -10px rgba(0,0,0,0.6);
            --shadow-modal: 0 25px 50px -12px rgba(0,0,0,0.7);
            --shadow-toast: 0 12px 24px -8px rgba(0,0,0,0.6);

            --glass-bg: rgba(30, 42, 60, 0.65);
            --glass-border: rgba(120, 150, 200, 0.2);
            --glass-inset: rgba(255, 255, 255, 0.08);
            --glass-inset-top: rgba(255, 255, 255, 0.12);

            --scrollbar-thumb: #3a4a63;
            --scrollbar-track: #1a2433;

            --modal-mask: rgba(0, 0, 0, 0.6);

            --sidebar-bg: #131c2c;
            --topbar-bg: #131c2c;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            height: 100%;
            font-family: 'Nunito', sans-serif;
            background: var(--bg-body-solid);
            color: var(--text-primary);
            transition: background 0.3s ease, color 0.3s ease;
        }
        button { font-family: 'Nunito', sans-serif; }

        /* 顶部悬浮主题切换按钮 */
        .theme-toggle {
            position: fixed;
            top: 1.2rem;
            right: 1.2rem;
            z-index: 900;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: var(--bg-card);
            border: 1.5px solid var(--border-soft);
            color: var(--text-primary);
            font-size: 1.1rem;
            cursor: pointer;
            box-shadow: var(--shadow-card);
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .theme-toggle:hover {
            background: var(--bg-hover);
            transform: translateY(-2px) rotate(15deg);
            box-shadow: var(--shadow-card-hover);
        }

        .toast {
            position: fixed;
            top: 1.2rem;
            left: 50%;
            transform: translateX(-50%) translateY(-20px);
            background: #1f334b;
            color: white;
            padding: 0.7rem 1.3rem;
            border-radius: 100px;
            font-size: 0.9rem;
            font-weight: 600;
            box-shadow: var(--shadow-toast);
            opacity: 0;
            pointer-events: none;
            transition: all 0.25s ease;
            z-index: 999;
            white-space: nowrap;
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        .toast.success { background: #1e9e4a; }
        .toast.error { background: #c93a3a; }
        .toast.warn { background: #d18b1e; }

        .page { display: none; min-height: 100vh; }
        .page.active { display: block; }

        /* ============================================================
           主页
        ============================================================ */
        .home-body {
            display: grid;
            grid-template-columns: 300px 1fr;
            min-height: 100vh;
        }

        .sidebar {
            background: var(--sidebar-bg);
            border-right: 1px solid var(--border-soft);
            padding: 1.6rem 1.2rem;
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
            position: sticky;
            top: 0;
            height: 100vh;
            overflow-y: auto;
            transition: background 0.3s ease, border-color 0.3s ease;
        }
        .sidebar h1 {
            font-size: 1.25rem;
            font-weight: 800;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .sidebar h1 .sub {
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--text-muted);
            background: var(--accent-soft);
            padding: 0.15rem 0.5rem;
            border-radius: 40px;
            margin-left: auto;
        }

        .add-panel {
            background: var(--bg-card-soft);
            border-radius: 1.2rem;
            padding: 1rem;
            border: 1px solid var(--border-soft);
            transition: background 0.3s ease, border-color 0.3s ease;
        }
        .add-panel .panel-title {
            font-size: 0.75rem;
            font-weight: 800;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 0.7rem;
        }
        .add-field {
            background: var(--bg-input);
            border-radius: 0.8rem;
            padding: 0.5rem 0.9rem;
            margin-bottom: 0.5rem;
            box-shadow: 0 0 0 1px var(--border-input) inset;
            transition: box-shadow 0.15s, background 0.3s;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }
        .add-field:focus-within { box-shadow: 0 0 0 2px var(--accent) inset; }
        .add-field.error { box-shadow: 0 0 0 2px #e57373 inset; }
        .add-field input {
            flex: 1;
            border: none;
            padding: 0.55rem 0;
            font-size: 0.92rem;
            font-weight: 500;
            color: var(--text-primary);
            background: transparent;
            outline: none;
            font-family: 'Nunito', sans-serif;
            min-width: 0;
        }
        .add-field input::placeholder { color: var(--text-placeholder); }

        .lookup-spinner {
            width: 13px; height: 13px;
            border: 2px solid var(--border-input);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            display: none;
            flex-shrink: 0;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .add-btns { display: flex; gap: 0.5rem; margin-top: 0.7rem; }
        .btn-add {
            flex: 1;
            background: var(--accent);
            border: none;
            color: white;
            font-weight: 700;
            padding: 0.7rem 0.8rem;
            border-radius: 100px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.15s;
            box-shadow: 0 6px 12px -4px rgba(108,139,199,0.4);
        }
        .btn-add:hover { background: var(--accent-hover); }
        .btn-add:disabled { background: var(--border-strong); cursor: not-allowed; }

        .btn-clear {
            background: var(--bg-input);
            border: 1.5px solid var(--border-soft);
            color: var(--text-secondary);
            font-weight: 700;
            padding: 0.7rem 0.9rem;
            border-radius: 100px;
            font-size: 0.85rem;
            cursor: pointer;
            white-space: nowrap;
            transition: background 0.15s;
        }
        .btn-clear:hover { background: var(--bg-hover); }

        .folder-block {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
            flex: 1;
            min-height: 0;
        }
        .folder-block-title {
            font-size: 0.75rem;
            font-weight: 800;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            padding: 0.3rem 0.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .folder-block-title .badge {
            background: var(--accent-soft);
            color: var(--accent-text);
            padding: 0.15rem 0.55rem;
            border-radius: 100px;
            font-size: 0.7rem;
            font-weight: 700;
        }

        .date-list {
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
            overflow-y: auto;
            padding-right: 0.2rem;
            flex: 1;
            min-height: 0;
            scrollbar-width: thin;
        }
        .date-list::-webkit-scrollbar { width: 5px; }
        .date-list::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); border-radius: 20px; }

        .date-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.65rem 0.85rem;
            border-radius: 0.85rem;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.88rem;
            color: var(--text-secondary);
            transition: all 0.15s;
            border: 1.5px solid transparent;
            gap: 0.5rem;
        }
        .date-item:hover { background: var(--bg-hover); }
        .date-item.active {
            background: var(--accent);
            color: white;
            box-shadow: 0 6px 14px -6px rgba(108,139,199,0.6);
        }
        .date-item .info { display: flex; flex-direction: column; gap: 0.1rem; min-width: 0; }
        .date-item .info .main { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .date-item .info .sub { font-size: 0.68rem; font-weight: 500; opacity: 0.75; }
        .date-item .count {
            font-size: 0.7rem;
            background: rgba(0,0,0,0.08);
            padding: 0.15rem 0.5rem;
            border-radius: 40px;
            font-weight: 700;
            flex-shrink: 0;
        }
        [data-theme="dark"] .date-item .count { background: rgba(255,255,255,0.1); }
        .date-item.active .count { background: rgba(255,255,255,0.25); }

        .wrongbook-entry {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.75rem 0.9rem;
            border-radius: 0.9rem;
            cursor: pointer;
            background: var(--danger-soft);
            border: 1.5px solid var(--danger-border);
            color: var(--danger);
            font-weight: 800;
            font-size: 0.9rem;
            transition: all 0.15s;
            gap: 0.5rem;
        }
        .wrongbook-entry:hover {
            background: var(--danger-soft-hover);
            transform: translateY(-1px);
        }
        .wrongbook-entry .wb-left {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .wrongbook-entry .wb-count {
            background: var(--danger);
            color: white;
            font-size: 0.7rem;
            padding: 0.15rem 0.55rem;
            border-radius: 40px;
            font-weight: 800;
        }

        .sidebar-foot {
            border-top: 1px solid var(--border-soft);
            padding-top: 0.9rem;
            font-size: 0.72rem;
            color: var(--text-muted);
            text-align: center;
            font-weight: 500;
        }

        .home-content {
            padding: 2rem 2rem 3rem;
            min-width: 0;
        }
        .content-header {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            gap: 0.8rem;
        }
        .content-header h2 {
            font-size: 1.7rem;
            font-weight: 800;
            color: var(--text-primary);
            letter-spacing: -0.02em;
        }
        .content-header .content-sub {
            font-size: 0.9rem;
            color: var(--text-muted);
            font-weight: 600;
            margin-top: 0.3rem;
        }
        .content-header .toolbar { display: flex; gap: 0.6rem; align-items: center; }
        .toolbar-btn {
            background: var(--bg-card);
            border: 1.5px solid var(--border-strong);
            color: var(--text-secondary);
            padding: 0.55rem 1.1rem;
            border-radius: 100px;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.15s;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }
        .toolbar-btn:hover { background: var(--accent-soft); border-color: var(--accent); }
        .toolbar-btn.primary {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
            box-shadow: 0 6px 14px -6px rgba(108,139,199,0.6);
        }
        .toolbar-btn.primary:hover { background: var(--accent-hover); }
        .toolbar-btn.danger:hover { background: var(--danger-soft); border-color: var(--danger); color: var(--danger); }

        .search-wrap {
            position: relative;
            margin-bottom: 1.2rem;
        }
        .search-wrap input {
            width: 100%;
            border: 1.5px solid var(--border-input);
            border-radius: 100px;
            padding: 0.8rem 1.2rem 0.8rem 2.8rem;
            font-size: 0.95rem;
            font-family: 'Nunito', sans-serif;
            color: var(--text-primary);
            background: var(--bg-input);
            outline: none;
            transition: all 0.15s;
            box-shadow: 0 2px 8px -4px rgba(31,45,70,0.06);
        }
        .search-wrap input:focus {
            border-color: var(--accent);
            box-shadow: 0 6px 18px -8px rgba(108,139,199,0.4);
        }
        .search-wrap input::placeholder { color: var(--text-placeholder); }
        .search-wrap .search-icon {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-faint);
            font-size: 1.05rem;
            pointer-events: none;
        }
        .search-wrap .search-clear {
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-faint);
            font-size: 1rem;
            cursor: pointer;
            background: transparent;
            border: none;
            padding: 0.2rem 0.5rem;
            border-radius: 40px;
            display: none;
        }
        .search-wrap .search-clear:hover { background: var(--bg-hover); color: var(--text-secondary); }
        .search-wrap.has-text .search-clear { display: block; }

        .card-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1.1rem;
        }
        @media (max-width: 1200px) { .card-grid { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 860px)  { .card-grid { grid-template-columns: 1fr; } }

        .big-card {
            background: var(--bg-card);
            border-radius: 1.4rem;
            padding: 1.3rem 1.3rem 1.2rem;
            box-shadow: var(--shadow-card), 0 0 0 1px var(--border-soft) inset;
            transition: all 0.18s;
            display: flex;
            flex-direction: column;
            animation: cardIn 0.25s ease;
        }
        .big-card:hover {
            box-shadow: var(--shadow-card-hover), 0 0 0 1px var(--border-strong) inset;
            transform: translateY(-2px);
        }
        @keyframes cardIn {
            from { opacity: 0; transform: translateY(6px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .word-hover-trigger {
            font-size: 1.35rem;
            font-weight: 800;
            color: var(--text-primary);
            line-height: 1.25;
            word-break: break-word;
            margin-bottom: 0.5rem;
            letter-spacing: -0.01em;
            display: inline-block;
            position: relative;
            cursor: help;
            transition: color 0.15s;
        }
        .word-hover-trigger:hover { color: var(--accent-text); }
        .word-hover-trigger::after {
            content: '';
            position: absolute;
            left: 0;
            bottom: -3px;
            height: 2px;
            width: 100%;
            background: linear-gradient(90deg, var(--accent), var(--accent-text));
            border-radius: 2px;
            transform: scaleX(0);
            transform-origin: left;
            transition: transform 0.2s ease;
        }
        .word-hover-trigger:hover::after { transform: scaleX(1); }

        .word-hover-trigger.deep-red { color: var(--danger-deep); }
        .word-hover-trigger.deep-red:hover { color: #ff7070; }

        .big-card .card-cn {
            font-size: 0.95rem;
            color: var(--text-secondary);
            font-weight: 500;
            line-height: 1.5;
            word-break: break-word;
            margin-bottom: 0.8rem;
            flex: 1;
        }
        .big-card .card-cn.empty { color: var(--text-faint); font-style: italic; }

        .wrong-marks {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-bottom: 0.7rem;
            padding: 0.5rem 0.6rem;
            background: var(--danger-soft);
            border-radius: 0.7rem;
            border: 1px dashed var(--danger-border);
            align-items: center;
            min-height: 2rem;
        }
        .wrong-marks .marks-label {
            font-size: 0.7rem;
            font-weight: 800;
            color: var(--danger);
            margin-right: 0.2rem;
            letter-spacing: 0.3px;
        }
        .wrong-marks .mark {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 26px;
            height: 20px;
            border-radius: 40px;
            background: var(--danger-soft-hover);
            color: var(--danger);
            font-size: 0.72rem;
            font-weight: 800;
            border: 1px solid var(--danger-border);
        }
        .wrong-marks .mark.deep {
            background: var(--danger-deep);
            color: #ffe0e0;
            border-color: var(--danger-deep);
        }

        .big-card .card-actions {
            display: flex;
            gap: 0.4rem;
            margin-top: auto;
            padding-top: 0.7rem;
            border-top: 1px dashed var(--border-soft);
        }
        .big-card .mini-btn {
            flex: 1;
            background: var(--accent-soft);
            border: none;
            color: var(--accent-text);
            font-size: 0.78rem;
            font-weight: 700;
            padding: 0.45rem 0.6rem;
            border-radius: 100px;
            cursor: pointer;
            transition: all 0.15s;
            white-space: nowrap;
        }
        .big-card .mini-btn:hover { background: var(--accent-soft-hover); }
        .big-card .mini-btn.open { background: var(--accent); color: white; }
        .big-card .mini-btn.del {
            flex: 0 0 auto;
            background: transparent;
            color: var(--text-faint);
            padding: 0.45rem 0.7rem;
        }
        .big-card .mini-btn.del:hover { background: var(--danger-soft); color: var(--danger); }

        .big-card .dot {
            display: inline-block;
            width: 5px; height: 5px;
            background: #e57373;
            border-radius: 50%;
            margin-left: 0.3rem;
            vertical-align: middle;
        }

        .ext-panel {
            margin-top: 0.8rem;
            padding: 0.9rem 1rem;
            border-radius: 1rem;
            background: var(--bg-card-soft);
            border: 1px dashed var(--border-input);
            animation: extIn 0.22s ease;
        }
        @keyframes extIn {
            from { opacity: 0; transform: translateY(-4px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .ext-section { margin-bottom: 0.75rem; }
        .ext-section:last-child { margin-bottom: 0; }
        .ext-label {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.4rem;
            font-size: 0.72rem;
            font-weight: 800;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 0.35rem;
        }
        .ext-value {
            font-size: 0.88rem;
            color: var(--text-primary);
            font-weight: 500;
            line-height: 1.5;
            word-break: break-word;
            background: var(--bg-input);
            padding: 0.55rem 0.8rem;
            border-radius: 0.7rem;
            box-shadow: 0 0 0 1px var(--border-soft) inset;
            min-height: 2.1rem;
            white-space: pre-wrap;
        }
        .ext-value.placeholder { color: var(--text-faint); font-style: italic; }

        .ext-edit-area { display: flex; flex-direction: column; gap: 0.4rem; }
        .ext-edit-area textarea {
            width: 100%;
            border: 1.5px solid var(--border-input);
            border-radius: 0.7rem;
            padding: 0.55rem 0.8rem;
            font-size: 0.88rem;
            font-family: 'Nunito', sans-serif;
            color: var(--text-primary);
            outline: none;
            resize: vertical;
            min-height: 2.3rem;
            background: var(--bg-input);

        // ============================================================
        // ★ 主题切换
        // ============================================================
        function applyTheme(theme) {
            if (theme === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
                themeToggle.textContent = '☀️';
                themeToggle.title = '切换到浅色模式';
            } else {
                document.documentElement.removeAttribute('data-theme');
                themeToggle.textContent = '🌙';
                themeToggle.title = '切换到深色模式';
            }
        }

        function initTheme() {
            let theme = localStorage.getItem(THEME_KEY);
            if (!theme) {
                // 跟随系统
                if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                    theme = 'dark';
                } else {
                    theme = 'light';
                }
            }
            applyTheme(theme);
        }

        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
            const next = current === 'dark' ? 'light' : 'dark';
            localStorage.setItem(THEME_KEY, next);
            applyTheme(next);
            showToast(next === 'dark' ? '🌙 深色模式' : '☀️ 浅色模式', 'info');
        }

        let toastTimer = null;
        function showToast(msg, type = 'info') {
            toastEl.textContent = msg;
            toastEl.className = 'toast show ' + type;
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => {
                toastEl.className = 'toast ' + type;
            }, 1800);
        }

        function todayKey() {
            const d = new Date();
            return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
        }
        function yesterdayKey() {
            const d = new Date();
            d.setDate(d.getDate() - 1);
            return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
        }
        function friendlyDate(key) {
            if (key === todayKey()) return `今天 · ${key}`;
            if (key === yesterdayKey()) return `昨天 · ${key}`;
            return key;
        }

        function load() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                data = raw ? JSON.parse(raw) : {};
                if (typeof data !== 'object' || Array.isArray(data)) data = {};
                Object.keys(data).forEach(k => {
                    if (!Array.isArray(data[k])) data[k] = [];
                });
            } catch (e) {
                console.error('load error', e);
                data = {};
            }
            if (!data[currentDate]) data[currentDate] = [];

            try {
                const rawWb = localStorage.getItem(WRONGBOOK_KEY);
                wrongbook = rawWb ? JSON.parse(rawWb) : {};
                if (typeof wrongbook !== 'object' || Array.isArray(wrongbook)) wrongbook = {};
            } catch (e) {
                console.error('load wrongbook error', e);
                wrongbook = {};
            }
        }

        function save() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
                return true;
            } catch (e) {
                console.error('save error', e);
                showToast('保存失败：存储空间可能已满', 'error');
                return false;
            }
        }
        function saveWrongbook() {
            try {
                localStorage.setItem(WRONGBOOK_KEY, JSON.stringify(wrongbook));
                return true;
            } catch (e) {
                console.error('save wrongbook error', e);
                return false;
            }
        }

        function escapeHtml(t) {
            if (t === null || t === undefined) return '';
            return String(t).replace(/[&<>"']/g, m => ({
                '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'
            })[m]);
        }

        function normalize(str) {
            return String(str || '')
                .toLowerCase()
                .replace(/[\s，。、,.;；:：!！?？'"（）()【】\[\]\-—…·]/g, '');
        }
        function isAnswerCorrect(userInput, standard) {
            const u = normalize(userInput);
            const s = normalize(standard);
            if (!u || !s) return false;
            if (u === s) return true;
            if (u.includes(s)) return true;
            if (s.includes(u) && u.length >= 2) return true;
            const segments = String(standard)
                .split(/[；;，,。.、\s\/|]+/)
                .map(normalize)
                .filter(x => x.length >= 2);
            for (const seg of segments) {
                if (u.includes(seg) || seg.includes(u)) return true;
            }
            return false;
        }

        // ============================================================
        // 错题本逻辑
        // ============================================================
        function recordWrong(en, cn) {
            const key = en.toLowerCase();
            const today = todayKey();

            if (!wrongbook[key]) {
                wrongbook[key] = {
                    en: en,
                    cn: cn || '',
                    count: 0,
                    dates: []
                };
            }
            wrongbook[key].en = en;
            if (cn) wrongbook[key].cn = cn;

            if (!wrongbook[key].dates.includes(today)) {
                wrongbook[key].count += 1;
                wrongbook[key].dates.push(today);
                saveWrongbook();
                return true;
            }
            saveWrongbook();
            return false;
        }

        function getWrongCount(en) {
            const key = en.toLowerCase();
            return wrongbook[key] ? wrongbook[key].count : 0;
        }

        function getWrongbookCount() {
            return Object.keys(wrongbook).length;
        }

        function removeFromWrongbook(en) {
            const key = en.toLowerCase();
            delete wrongbook[key];
            saveWrongbook();
        }

        // ============================================================
        // 自动查词
        // ============================================================
        async function lookupWord(word) {
            const key = word.toLowerCase().trim();
            if (!key) return null;
            if (lookupCache[key]) return lookupCache[key];

            const url = `https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(key)}`;
            try {
                const res = await fetch(url);
                if (!res.ok) {
                    if (res.status === 404) {
                        const empty = { synonyms: '', forms: '' };
                        lookupCache[key] = empty;
                        return empty;
                    }
                    throw new Error('HTTP ' + res.status);
                }
                const json = await res.json();
                const result = parseApiResult(json);
                lookupCache[key] = result;
                return result;
            } catch (e) {
                console.warn('lookup failed:', e);
                return null;
            }
        }

        function parseApiResult(json) {
            if (!Array.isArray(json) || json.length === 0) {
                return { synonyms: '', forms: '' };
            }
            const synonymSet = new Set();
            const formLines = [];

            json.forEach(entry => {
                const meanings = entry.meanings || [];
                meanings.forEach(meaning => {
                    const pos = meaning.partOfSpeech || '';
                    const defs = meaning.definitions || [];

                    (meaning.synonyms || []).forEach(s => {
                        if (s && s.toLowerCase() !== entry.word.toLowerCase()) synonymSet.add(s);
                    });
                    defs.forEach(def => {
                        (def.synonyms || []).forEach(s => {
                            if (s && s.toLowerCase() !== entry.word.toLowerCase()) synonymSet.add(s);
                        });
                    });

                    if (defs.length > 0) {
                        const shortDef = defs[0].definition || '';
                        formLines.push(`• ${pos}: ${shortDef.slice(0, 60)}${shortDef.length > 60 ? '…' : ''}`);
                    }
                });
            });

            const synonyms = Array.from(synonymSet).slice(0, 10).join(', ');
            const seenPos = new Set();
            const forms = formLines.filter(line => {
                const pos = line.split(':')[0];
                if (seenPos.has(pos)) return false;
                seenPos.add(pos);
                return true;
            }).slice(0, 6).join('\n');

            return { synonyms, forms };
        }

        async function fetchExtFor(word) {
            lookupSpinner.style.display = 'block';
            try {
                return await lookupWord(word);
            } finally {
                lookupSpinner.style.display = 'none';
            }
        }

        // ============================================================
        // 玻璃悬浮窗
        // ============================================================
        let tooltipShowTimer = null;
        let tooltipHideTimer = null;
        let currentTooltipTarget = null;

        function buildTooltipContent(trigger) {
            const cn = trigger.getAttribute('data-cn') || '';
            const syn = trigger.getAttribute('data-syn') || '';
            const forms = trigger.getAttribute('data-forms') || '';

            let html = '';
            if (cn) {
                html += `<div class="gt-cn">${cn}</div>`;
            } else {
                html += `<div class="gt-cn placeholder">（还没有填写释义）</div>`;
            }

            const extParts = [];
            if (syn) {
                extParts.push(`
                    <div class="gt-ext-label">🔁 同义替换</div>
                    <div class="gt-ext-value">${syn}</div>
                `);
            }
            if (forms) {
                extParts.push(`
                    <div class="gt-ext-label" style="margin-top:0.5rem;">🧬 词性 / 变形</div>
                    <div class="gt-ext-value">${forms}</div>
                `);
            }
            if (extParts.length) {
                html += `<div class="gt-ext">${extParts.join('')}</div>`;
            }
            return html;
        }

        function positionTooltip(trigger) {
            const rect = trigger.getBoundingClientRect();
            const tipRect = glassTooltip.getBoundingClientRect();
            const gap = 12;

            let top = rect.top - tipRect.height - gap;
            let left = rect.left;

            if (top < 8) {
                top = rect.bottom + gap;
            }
            if (left + tipRect.width > window.innerWidth - 12) {
                left = window.innerWidth - tipRect.width - 12;
            }
            if (left < 12) left = 12;

            glassTooltip.style.top = top + 'px';
            glassTooltip.style.left = left + 'px';
        }

        function showTooltip(trigger) {
            clearTimeout(tooltipHideTimer);
            currentTooltipTarget = trigger;

            glassTooltip.innerHTML = buildTooltipContent(trigger);
            glassTooltip.style.top = '-9999px';
            glassTooltip.style.left = '-9999px';
            glassTooltip.classList.add('show');
            requestAnimationFrame(() => positionTooltip(trigger));
        }

        function hideTooltip() {
            clearTimeout(tooltipShowTimer);
            glassTooltip.classList.remove('show');
            currentTooltipTarget = null;
        }

        function bindTooltipEvents() {
            cardGrid.addEventListener('mouseover', e => {
                const trigger = e.target.closest('.word-hover-trigger');
                if (!trigger) return;
                if (trigger === currentTooltipTarget) return;

                clearTimeout(tooltipHideTimer);
                clearTimeout(tooltipShowTimer);
                tooltipShowTimer = setTimeout(() => showTooltip(trigger), 100);
            });

            cardGrid.addEventListener('mouseout', e => {
                const trigger = e.target.closest('.word-hover-trigger');
                if (!trigger) return;

                const related = e.relatedTarget;
                if (related && trigger.contains(related)) return;

                clearTimeout(tooltipShowTimer);
                tooltipHideTimer = setTimeout(() => {
                    if (!trigger.matches(':hover')) {
                        hideTooltip();
                    }
                }, 80);
            });

            window.addEventListener('scroll', () => {
                if (currentTooltipTarget && glassTooltip.classList.contains('show')) {
                    positionTooltip(currentTooltipTarget);
                }
            }, true);

            window.addEventListener('resize', () => {
                if (currentTooltipTarget && glassTooltip.classList.contains('show')) {
                    positionTooltip(currentTooltipTarget);
                }
            });

            document.addEventListener('click', e => {
                if (currentTooltipTarget && !e.target.closest('.word-hover-trigger')) {
                    hideTooltip();
                }
            });
        }

        // ============================================================

        async function addWord() {
            const en = enInput.value.trim();
            const cn = cnInput.value.trim();

            enBox.classList.remove('error');
            cnBox.classList.remove('error');

            if (!en) {
                enBox.classList.add('error');
                enInput.focus();
                showToast('请输入英文单词', 'warn');
                setTimeout(() => enBox.classList.remove('error'), 1200);
                return;
            }

            const today = todayKey();
            if (!data[today]) data[today] = [];

            const exists = data[today].some(
                w => w.en.toLowerCase() === en.toLowerCase() && (w.cn || '') === cn
            );
            if (exists) {
                cnBox.classList.add('error');
                showToast('这个单词已存在（同释义）', 'warn');
                setTimeout(() => cnBox.classList.remove('error'), 1200);
                return;
            }

            addBtn.disabled = true;

            let ext = { synonyms: '', forms: '' };
            try {
                const fetched = await fetchExtFor(en);
                if (fetched) ext = fetched;
            } catch (e) {
                console.warn('auto lookup failed', e);
            }

            data[today].push({ en, cn, ext, addedAt: Date.now() });

            addBtn.disabled = false;

            if (!save()) return;

            currentDate = today;

            renderHome();
            enInput.value = '';
            cnInput.value = '';
            enInput.focus();

            if (ext.synonyms || ext.forms) {
                showToast(`已添加并自动补充拓展：${en}`, 'success');
            } else {
                showToast(`已添加：${en}（未查到拓展）`, 'info');
            }
        }

        function deleteWordByIndex(idx) {
            const list = data[currentDate] || [];
            if (idx < 0 || idx >= list.length) return;
            const removed = list.splice(idx, 1)[0];
            expandedSet.delete(`${currentDate}::${idx}`);
            editingMap.delete(`${currentDate}::${idx}`);
            save();
            renderHome();
            hideTooltip();
            showToast(`已删除：${removed.en}`, 'info');
        }

        function clearCurrentDate() {
            const list = data[currentDate] || [];
            if (list.length === 0) {
                showToast('这一天没有单词', 'warn');
                return;
            }
            if (confirm(`确定清空「${friendlyDate(currentDate)}」的全部单词？`)) {
                data[currentDate] = [];
                expandedSet.clear();
                editingMap.clear();
                save();
                renderHome();
                hideTooltip();
                showToast('已清空', 'info');
            }
        }

        // ============================================================
        // 拓展面板
        // ============================================================
        function toggleExt(idx) {
            const ek = `${currentDate}::${idx}`;
            if (expandedSet.has(ek)) {
                expandedSet.delete(ek);
                editingMap.delete(ek);
            } else {
                expandedSet.add(ek);
            }
            renderCardGrid();
        }

        function startEditExt(idx) {
            const list = data[currentDate] || [];
            const item = list[idx];
            if (!item) return;
            const ext = item.ext || {};
            editingMap.set(`${currentDate}::${idx}`, {
                synonyms: ext.synonyms || '',
                forms: ext.forms || ''
            });
            renderCardGrid();
            setTimeout(() => {
                const ta = cardGrid.querySelector(`.ext-edit-area textarea[data-field="synonyms"]`);
                if (ta) ta.focus();
            }, 30);
        }

        function cancelEditExt(idx) {
            editingMap.delete(`${currentDate}::${idx}`);
            renderCardGrid();
        }

        function saveExt(idx) {
            const list = data[currentDate] || [];
            const item = list[idx];
            if (!item) return;
            const ek = `${currentDate}::${idx}`;
            const editing = editingMap.get(ek);
            if (!editing) return;

            const synEl = cardGrid.querySelector(`.ext-edit-area textarea[data-field="synonyms"]`);
            const formEl = cardGrid.querySelector(`.ext-edit-area textarea[data-field="forms"]`);
            const synonyms = synEl ? synEl.value.trim() : editing.synonyms;
            const forms = formEl ? formEl.value.trim() : editing.forms;

            item.ext = { synonyms, forms };
            editingMap.delete(ek);

            if (save()) showToast('已保存拓展', 'success');
            renderCardGrid();
        }

        async function lookupAgain(idx) {
            const list = data[currentDate] || [];
            const item = list[idx];
            if (!item) return;
            const btn = cardGrid.querySelector(`.btn-mini.lookup[data-idx="${idx}"]`);
            if (btn) {
                btn.disabled = true;
                btn.textContent = '⏳ 查询中...';
            }
            try {
                delete lookupCache[item.en.toLowerCase()];
                const ext = await lookupWord(item.en);
                if (ext) {
                    const editing = editingMap.get(`${currentDate}::${idx}`);
                    if (editing) {
                        editing.synonyms = ext.synonyms || editing.synonyms;
                        editing.forms = ext.forms || editing.forms;
                        editingMap.set(`${currentDate}::${idx}`, editing);
                    }
                    showToast(ext.synonyms || ext.forms ? '查到了拓展' : '没有找到拓展', ext.synonyms || ext.forms ? 'success' : 'warn');
                } else {
                    showToast('查询失败（网络问题？）', 'error');
                }
            } catch (e) {
                showToast('查询失败', 'error');
            }
            renderCardGrid();
        }

        // ============================================================
        // 复习
        // ============================================================
        function checkAnswer(idx) {
            const list = data[reviewDate] || [];
            const item = list[idx];
            if (!item) return;
            const st = reviewState[idx];
            if (!st || st.status !== 'pending') return;

            const inputEl = reviewList.querySelector(`.review-input[data-idx="${idx}"]`);
            const userInput = inputEl ? inputEl.value.trim() : '';
            if (!userInput) {
                if (inputEl) inputEl.focus();
                showToast('请先输入答案', 'warn');
                return;
            }
            st.input = userInput;
            const correct = isAnswerCorrect(userInput, item.cn || '');
            st.status = correct ? 'correct' : 'wrong';

            if (!correct) {
                const isNew = recordWrong(item.en, item.cn || '');
                if (isNew) {
                    showToast(`已记入错题本：${item.en}`, 'error');
                } else {
                    showToast(`今天已记过：${item.en}`, 'warn');
                }
                renderSidebar();
            }

            renderReviewPage();
        }

        // ============================================================
        // 弹窗
        // ============================================================
        let pendingDate = null;
        function openModal(dateKey) {
            pendingDate = dateKey;
            modalTitle.textContent = friendlyDate(dateKey);
            modalMask.classList.add('show');
        }
        function closeModal() {
            modalMask.classList.remove('show');
            pendingDate = null;
        }

        // ============================================================
        // 事件绑定
        // ============================================================
        function bindEvents() {
            // ★ 主题切换
            themeToggle.addEventListener('click', toggleTheme);

            addBtn.addEventListener('click', addWord);
            enInput.addEventListener('keypress', e => {
                if (e.key === 'Enter') { e.preventDefault(); cnInput.focus(); }
            });
            cnInput.addEventListener('keypress', e => {
                if (e.key === 'Enter') { e.preventDefault(); addWord(); }
            });

            clearTodayBtn.addEventListener('click', clearCurrentDate);
            clearViewBtn.addEventListener('click', clearCurrentDate);

            searchInput.addEventListener('input', () => {
                searchQuery = searchInput.value;
                searchWrap.classList.toggle('has-text', !!searchQuery);
                renderCardGrid();
            });
            searchClear.addEventListener('click', () => {
                searchInput.value = '';
                searchQuery = '';
                searchWrap.classList.remove('has-text');
                searchInput.focus();
                renderCardGrid();
            });

            dateList.addEventListener('click', e => {
                const item = e.target.closest('.date-item');
                if (!item) return;
                const d = item.getAttribute('data-date');
                if (d === currentDate) {
                    openModal(d);
                } else {
                    currentDate = d;
                    expandedSet.clear();
                    editingMap.clear();
                    renderHome();
                }
            });

            wrongbookEntry.addEventListener('click', goWrongbook);
            backFromWrongbookBtn.addEventListener('click', goHome);

            wrongbookList.addEventListener('click', e => {
                const btn = e.target.closest('.wb-clear-btn');
                if (!btn) return;
                const en = btn.getAttribute('data-en');
                if (en && confirm(`把「${en}」从错题本移除？`)) {
                    removeFromWrongbook(en);
                    renderWrongbookPage();
                    renderSidebar();
                    renderCardGrid();
                    showToast('已移除', 'info');
                }
            });

            optView.addEventListener('click', () => {
                if (pendingDate) {
                    currentDate = pendingDate;
                    expandedSet.clear();
                    editingMap.clear();
                    renderHome();
                }
                closeModal();
            });
            optReview.addEventListener('click', () => {
                if (pendingDate) goReview(pendingDate);
                closeModal();
            });
            modalCancel.addEventListener('click', closeModal);
            modalMask.addEventListener('click', e => {
                if (e.target === modalMask) closeModal();
            });
            document.addEventListener('keydown', e => {
                if (e.key === 'Escape' && modalMask.classList.contains('show')) closeModal();
            });

            reviewBtn.addEventListener('click', () => {
                goReview(currentDate);
            });

            cardGrid.addEventListener('click', e => {
                const btn = e.target.closest('button');
                if (!btn) return;
                const action = btn.getAttribute('data-action');
                const idxAttr = btn.getAttribute('data-idx');
                const idx = idxAttr !== null ? parseInt(idxAttr, 10) : NaN;
                if (isNaN(idx)) return;

                if (action === 'toggle-ext') toggleExt(idx);
                else if (action === 'edit-ext') startEditExt(idx);
                else if (action === 'cancel-edit') cancelEditExt(idx);
                else if (action === 'save-ext') saveExt(idx);
                else if (action === 'delete') deleteWordByIndex(idx);
                else if (action === 'lookup-again') lookupAgain(idx);
            });

            cardGrid.addEventListener('keydown', e => {
                if (!(e.ctrlKey || e.metaKey) || e.key !== 'Enter') return;
                const ta = e.target.closest('.ext-edit-area textarea');
                if (!ta) return;
                e.preventDefault();
                const card = ta.closest('.big-card');
                if (!card) return;
                const idx = parseInt(card.getAttribute('data-idx'), 10);
                if (!isNaN(idx)) saveExt(idx);
            });

            backFromReviewBtn.addEventListener('click', goHome);
            reviewList.addEventListener('click', e => {
                const btn = e.target.closest('.btn-check');
                if (!btn) return;
                const idx = parseInt(btn.getAttribute('data-idx'), 10);
                if (!isNaN(idx)) checkAnswer(idx);
            });
            reviewList.addEventListener('keypress', e => {
                if (e.key !== 'Enter') return;
                const input = e.target.closest('.review-input');
                if (!input) return;
                e.preventDefault();
                const idx = parseInt(input.getAttribute('data-idx'), 10);
                if (!isNaN(idx)) checkAnswer(idx);
            });

            bindTooltipEvents();

            document.addEventListener('keydown', e => {
                if (e.key === '/' && !e.target.matches('input, textarea')) {
                    e.preventDefault();
                    searchInput.focus();
                }
            });
        }

        function init() {
            initTheme();
            try { load(); } catch (e) { console.error('init load error', e); }
            try { renderHome(); } catch (e) {
                console.error('init render error', e);
                showToast('初始化渲染失败，请检查控制台', 'error');
            }
            bindEvents();
            enInput.focus();
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }

        window.addEventListener('error', e => {
            console.error('Runtime error:', e.message, e.filename, e.lineno);
        });
    })();
    </script>
</body>
</html>
